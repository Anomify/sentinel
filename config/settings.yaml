# Runtime settings. Secrets come from environment variables (see .env.example).

schedule:              # used by `sentinel daemon` / `sentinel serve` (cron or GitHub Actions can call the CLI instead)
  pages:      "every 6h"          # Module 9: page/pricing/messaging diffs
  feeds:      "every 3h"          # content engine
  subdomains: "every 1h"          # Module 4: certificate transparency (near-real-time)
  dns:        "daily 05:10"       # Module 3: TXT/SPF/MX/DMARC/DKIM
  stack:      "daily 05:40"       # Modules 1+2: stack fingerprint + GTM container
  radar:      "daily 06:20"       # Module 5: staging, sitemaps, publishes, GitHub, launch score
  product:    "daily 06:35"       # product intelligence: new products, release notes, launches
  hiring:     "daily 06:50"       # Module 6: job boards
  money:      "daily 07:20"       # Module 7: partners, marketplaces, funding, press
  ads:        "daily 07:35"       # Module 8: ad libraries + pixel cross-check
  ai:         "daily 04:30"       # Module 10: AI-search visibility
  deepdive:   "daily 08:00"       # intelligence layer: regenerate every competitor deep dive
  digest:     "weekly mon 08:30"

fetch:
  renderer: auto       # auto | playwright | http   (auto = Playwright when installed)
  timeout_s: 30
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129 Safari/537.36"
  min_change_ratio: 0.01   # ignore text changes smaller than 1% unless a signal moved

analysis:
  provider: auto           # auto | gemini | claude, auto uses Claude if ANTHROPIC_API_KEY is set, else Gemini
  gemini_model: "gemini-3.5-flash"   # GEMINI_API_KEY; falls back to gemini-flash-latest when overloaded
  model: "claude-opus-5-5"           # ANTHROPIC_API_KEY
  effort: low

digest:
  title: "Weekly Competitive Brief"
  to: "keith@hyperfence.io"   # comma-separate for more; DIGEST_TO in .env overrides
  lookback_days: 7
  channels: [slack, email] # each only fires when its env vars are set
  app_url: "http://localhost:8000"
