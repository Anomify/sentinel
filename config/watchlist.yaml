# ─────────────────────────────────────────────────────────────────────────────
#  Sentinel CI, watchlist
#  Who you track, which pages matter, and where their content lives.
#  URLs below were verified live on 2026-10-14. Edit freely; the app re-syncs
#  this file on every run.
# ─────────────────────────────────────────────────────────────────────────────

# Your own brand, used for AI-search share-of-voice ("are WE in the answer?").
brand:
  name: "Hyperfence"            # ← change me
  aliases: []                     # e.g. ["YourCo", "YourProduct"]
  domains: ["hyperfence.io"]       # used to match AI citations (bare hostname)
  color: "#6250d6"
  # monitor: true tracks Hyperfence with every module (Signals, stack, DNS, hiring, product...) as if it
  # were a competitor. Optional, same keys as a competitor: pages, feeds, staging, github, ats, news_query.
  monitor: true
  social: { linkedin: "https://www.linkedin.com/company/hyperfenced", x: "https://x.com/hyperfenced" }
  feeds:
    - type: listing
      url: "https://hyperfence.io/blog/"
      link_pattern: "^/blog/[^/]+/?$"
  # Used to write the "Vs. us" recommendation on every finding, and to grade the
  # narrative accuracy of AI-search answers about you. Plain sentences work best.
  positioning: "The AI security platform for enterprises deploying agents and LLM apps."   # ← change me
  icp: "CISOs and AI platform leaders at regulated enterprises"                          # ← change me
  strengths: []          # e.g. ["Fastest time-to-value", "Deployed in customer VPC", "SOC 2 Type II"]
  facts: []              # ground truth for AI-answer accuracy, e.g. ["We offer a free tier", "We are SOC 2 Type II certified"]

# Terms whose frequency on competitor pages signals a messaging pivot.
watch_terms:
  - agentic
  - MCP
  - runtime
  - guardrails
  - red teaming
  - prompt injection
  - AI-SPM
  - governance
  - EU AI Act
  - free trial
  - enterprise
  - open source

# Lines matching these regexes are ignored when diffing (cookie banners, dates…)
ignore_patterns:
  - "(?i)cookie"
  - "(?i)accept all"
  - "(?i)©\\s*\\d{4}"
  - "(?i)all rights reserved"

competitors:
  - id: hiddenlayer
    name: HiddenLayer
    tier: primary                 # primary | secondary | platform
    color: "#2a78d6"
    aliases: ["Hidden Layer", "AISec Platform"]
    domains: ["hiddenlayer.com"]
    pages:
      - { kind: homepage,  url: "https://www.hiddenlayer.com/" }
      - { kind: product,   url: "https://www.hiddenlayer.com/platform/ai-runtime-security" }
      - { kind: product,   url: "https://www.hiddenlayer.com/solutions/ai-guardrails" }
      - { kind: product,   url: "https://www.hiddenlayer.com/solutions/agentic-mcp-security" }
      - { kind: product,   url: "https://www.hiddenlayer.com/platform/ai-attack-simulation" }
    feeds:
      # No RSS published, scrape the listing page for post links instead.
      - type: listing
        url: "https://www.hiddenlayer.com/innovation-hub/insights"
        link_pattern: "^/(insight|research|sai-security-advisory)/[^/]+/?$"
      - type: listing
        url: "https://www.hiddenlayer.com/innovation-hub/research"
        link_pattern: "^/(insight|research|sai-security-advisory)/[^/]+/?$"
    social: { linkedin: "https://www.linkedin.com/company/hiddenlayersec", x: "https://x.com/hiddenlayersec" }

  - id: alice
    name: Alice (WonderFence)
    tier: primary
    color: "#eb6834"
    aliases: ["Alice", "WonderFence", "ActiveFence", "Active Fence"]
    domains: ["alice.io", "activefence.com"]
    pages:
      - { kind: homepage, url: "https://alice.io/" }
      - { kind: product,  url: "https://alice.io/products/wonderfence" }
    feeds:
      - { type: rss, url: "https://alice.io/blog/rss.xml" }
    social: { linkedin: "https://www.linkedin.com/company/alice-io", x: "https://x.com/alice_dot_io" }

  - id: lakera
    name: Lakera
    tier: secondary
    color: "#1baf7a"
    aliases: ["Lakera Guard", "Lakera Red", "Gandalf"]
    domains: ["lakera.ai"]
    pages:
      - { kind: homepage, url: "https://www.lakera.ai/" }
    feeds:
      - type: listing
        url: "https://www.lakera.ai/blog"
        link_pattern: "^/blog/[a-z0-9-]+/?$"
    # Acquired by Check Point: Lakera now posts on Check Point's LinkedIn, so keep only posts about Lakera / AI security there.
    social: { linkedin: "https://www.linkedin.com/company/check-point-software-technologies", x: "https://x.com/lakeraai",
              filter_linkedin: "(?i)lakera|gandalf|AI security|GenAI|LLM|agentic|prompt injection|AI agent" }

  - id: aws-bedrock
    name: AWS Bedrock Guardrails
    tier: platform
    color: "#eda100"
    aliases: ["Bedrock Guardrails", "Amazon Bedrock Guardrails"]
    domains: ["aws.amazon.com"]
    pages:
      - { kind: product, url: "https://aws.amazon.com/bedrock/guardrails/" }
      - { kind: pricing, url: "https://aws.amazon.com/bedrock/pricing/", focus: "(?i)guardrail" }
    feeds:
      - { type: rss, url: "https://aws.amazon.com/blogs/aws/category/artificial-intelligence/amazon-machine-learning/amazon-bedrock/feed/" }
    # No dedicated Bedrock accounts: the AWS company accounts, filtered to Bedrock / guardrails posts.
    social: { linkedin: "https://www.linkedin.com/company/amazon-web-services", x: "https://x.com/awscloud", filter: "(?i)bedrock|guardrail" }

  - id: google-model-armor
    name: Google Model Armor
    tier: platform
    color: "#e87ba4"
    aliases: ["Model Armor", "Security Command Center AI Protection"]
    domains: ["cloud.google.com"]
    pages:
      - { kind: product, url: "https://cloud.google.com/security/products/model-armor" }
      - { kind: pricing, url: "https://cloud.google.com/security-command-center/pricing", focus: "(?i)model armor|AI protection" }
    feeds:
      - { type: rss, url: "https://cloudblog.withgoogle.com/products/ai-machine-learning/rss/" }
    social: { linkedin: "https://www.linkedin.com/company/google-cloud", x: "https://x.com/googlecloud", filter: "(?i)model armor|AI security|agent|guardrail|safety|gemini" }

  - id: azure-content-safety
    name: Azure AI Content Safety
    tier: platform
    color: "#008300"
    aliases: ["Azure Content Safety", "Prompt Shields", "Azure AI Foundry guardrails"]
    domains: ["azure.microsoft.com", "learn.microsoft.com"]
    pages:
      - { kind: product, url: "https://azure.microsoft.com/en-us/products/ai-services/ai-content-safety" }
    feeds:
      - { type: rss, url: "https://azure.microsoft.com/en-us/blog/product/azure-ai/feed/" }
    social: { linkedin: "https://www.linkedin.com/showcase/microsoft-azure", x: "https://x.com/azure", filter: "(?i)content safety|prompt shield|guardrail|responsible AI|AI Foundry|AI safety" }
