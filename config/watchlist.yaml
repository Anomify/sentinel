# ─────────────────────────────────────────────────────────────────────────────
#  Sentinel CI, watchlist
#  Who you track, which pages matter, and where their content lives.
#  URLs below were verified live on 2026-10-14. Edit freely; the app re-syncs
#  this file on every run.
# ─────────────────────────────────────────────────────────────────────────────

# Your own brand, used for AI-search share-of-voice ("are WE in the answer?").
brand:
  name: "Hyperfence"
  aliases: []
  domains: ["hyperfence.io"]       # used to match AI citations (bare hostname)
  color: "#6250d6"
  # monitor: true tracks Hyperfence with every module (Signals, stack, DNS, hiring, product...) as if it
  # were a competitor. Optional, same keys as a competitor: pages, feeds, staging, github, ats, news_query.
  monitor: true
  social: { linkedin: "https://www.linkedin.com/company/hyperfenced", x: "https://x.com/hyperfenced" }
  feeds:
    - type: listing
      url: "https://hyperfence.io/blog/"
      link_pattern: "^/blog/[^/]+/?$"
  # Used to write every "Vs. us" recommendation, the weekly brief and change analysis, and to grade what AI
  # search engines say about us. Every AI-written comment is written from this point of view.
  positioning: "The security layer AI doesn't come with: a transparent proxy between your app and any LLM provider that blocks prompt injection, off-topic and policy-violating prompts and responses deterministically, in milliseconds, without a second guard LLM."
  icp: "Developers and engineering teams shipping LLM-powered apps and agents who want protection in minutes, without a sales call."
  motion: "Developer-first and self-serve. Free plan, no credit card, two-minute integration. There is no sales team: growth comes from the product, docs, the live demo, content and integrations."
  products: ["Hyperfence proxy", "Preset Hyperfences (prompt injection, topic, HAP)", "Custom vector Hyperfences (Pro)", "Usage and blocked-event analytics", "Live demo"]
  strengths:
    - "Two-minute integration: change one value, the base URL. No SDK, no code changes"
    - "Deterministic, purpose-built ML classifiers; no guard LLM in the loop, so faster and cheaper"
    - "Millisecond latency, with full support for streaming responses"
    - "Zero retention of conversation data"
    - "Free plan with no credit card; live demo with no sign-up"
    - "Works with OpenAI, Anthropic, Google Gemini, DeepSeek, xAI and more"
  facts:   # ground truth for grading AI-search answers about us
    - "Hyperfence is an AI security platform: a transparent proxy that sits between an application and any LLM provider"
    - "Hyperfence blocks prompt injection and enforces topic and content policies on both prompts and responses"
    - "Hyperfence does not use a second guard LLM; it uses purpose-built ML classifiers and adds milliseconds of latency"
    - "Integration takes about two minutes and requires changing only the base URL; no SDK or code changes"
    - "Hyperfence has a free plan with no credit card required; Pro is coming soon and Enterprise is custom"
    - "Hyperfence retains no conversation data"
    - "Hyperfence supports OpenAI, Anthropic, Google Gemini, DeepSeek and xAI, including streaming responses"
    - "Hyperfence is self-serve and developer-first; it is not sold through a sales team"
  voice:   # rules for every AI-written recommendation
    - "Recommend product, docs, content, pricing, integration and community moves. Never recommend sales actions (no reps, SDRs, outbound, battlecards for sellers, renewals or account targeting): we have no sales team"
    - "Our audience is developers, not CISOs or procurement. Don't suggest targeting executives or regulated-enterprise buyers"
    - "Be concrete and short: what to build, write, publish or change, and why it beats the competitor's move"

# Terms whose frequency on competitor pages signals a messaging pivot.
watch_terms:
  - agentic
  - MCP
  - runtime
  - guardrails
  - red teaming
  - prompt injection
  - AI-SPM
  - governance
  - EU AI Act
  - free trial
  - enterprise
  - open source

# Lines matching these regexes are ignored when diffing (cookie banners, dates…)
ignore_patterns:
  - "(?i)cookie"
  - "(?i)accept all"
  - "(?i)©\\s*\\d{4}"
  - "(?i)all rights reserved"

competitors:
  - id: hiddenlayer
    name: HiddenLayer
    tier: primary                 # primary | secondary | platform
    color: "#2a78d6"
    aliases: ["Hidden Layer", "AISec Platform"]
    domains: ["hiddenlayer.com"]
    pages:
      - { kind: homepage,  url: "https://www.hiddenlayer.com/" }
      - { kind: product,   url: "https://www.hiddenlayer.com/platform/ai-runtime-security" }
      - { kind: product,   url: "https://www.hiddenlayer.com/solutions/ai-guardrails" }
      - { kind: product,   url: "https://www.hiddenlayer.com/solutions/agentic-mcp-security" }
      - { kind: product,   url: "https://www.hiddenlayer.com/platform/ai-attack-simulation" }
    feeds:
      # No RSS published, scrape the listing page for post links instead.
      - type: listing
        url: "https://www.hiddenlayer.com/innovation-hub/insights"
        link_pattern: "^/(insight|research|sai-security-advisory)/[^/]+/?$"
      - type: listing
        url: "https://www.hiddenlayer.com/innovation-hub/research"
        link_pattern: "^/(insight|research|sai-security-advisory)/[^/]+/?$"
