[project]
name = "sentinel-ci"
version = "2.0.0"
description = "GTM-stack & competitive intelligence with change detection: stack, tracking, DNS, certificates, staging, hiring, partners, ads, positioning and AI-search visibility."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
postgres = ["psycopg[binary]>=3.1"]
ads = ["google-cloud-bigquery>=3.20"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sentinel = "cimonitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cimonitor*"]
