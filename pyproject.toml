[project]
name = "sentinel-ci"
version = "1.0.0"
description = "Competitive intelligence monitor: page changes, competitor content, AI-search visibility, weekly digest."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sentinel = "cimonitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cimonitor*"]
