# Zero-infrastructure mode: GitHub Actions runs the collectors on a schedule and
# keeps the SQLite database on a dedicated `sentinel-data` branch.
# Add your API keys / webhook as repository secrets. Disable this workflow if you
# run Sentinel on a server (Docker) instead — its built-in scheduler does the same.
name: Monitor
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6h: all collection modules + deep dives
    - cron: "41 4 * * *"       # daily: AI-search visibility
    - cron: "43 12 * * 1"      # Monday: weekly digest
  workflow_dispatch:
    inputs:
      full: { description: "Also run AI visibility + digest", type: boolean, default: false }
      target: { description: "Optional: one competitor id or domain to deep-dive", type: string, default: "" }

permissions: { contents: write }
concurrency: { group: sentinel-monitor, cancel-in-progress: false }

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      SENTINEL_DATA_DIR: ${{ github.workspace }}/state
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore database
        id: restore
        run: |
          mkdir -p state
          # No data branch yet: first run. Branch exists but can't be read: stop, or the persist step would overwrite history.
          if git ls-remote --exit-code --heads origin sentinel-data >/dev/null; then
            git fetch --depth 1 origin sentinel-data
            git show FETCH_HEAD:sentinel.db > state/sentinel.db
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[browser]" && playwright install --with-deps chromium
      - name: One target
        if: inputs.target != ''
        run: sentinel scan "${{ inputs.target }}"
      - name: Collect (all modules)
        id: collect
        if: github.event.schedule == '17 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.target == '')
        run: |
          failed=""
          for m in dns subdomains stack pages feeds radar product social hiring money ads deepdive; do sentinel $m || failed="$failed $m"; done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: AI visibility
        if: github.event.schedule == '41 4 * * *' || inputs.full
        run: sentinel ai
      - name: Weekly digest
        if: github.event.schedule == '43 12 * * 1' || inputs.full
        run: sentinel digest
      - name: Persist database
        # Save whatever was collected even if a later step failed, but never after a failed restore.
        if: always() && steps.restore.outcome == 'success'
        run: |
          cd state
          git init -q -b sentinel-data && git add sentinel.db evidence 2>/dev/null || git add sentinel.db
          git -c user.name=sentinel -c user.email=sentinel@users.noreply.github.com commit -qm "data: $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sentinel-data
      - name: Back up database
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with: { name: "sentinel-db-${{ github.run_id }}", path: state/sentinel.db, retention-days: 30, if-no-files-found: ignore }
      - name: Report failed modules
        if: steps.collect.outputs.failed != ''
        run: |
          echo "::error::Modules failed:${{ steps.collect.outputs.failed }}"
          exit 1
      - name: Alert on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "{\"text\":\"Sentinel monitor run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
